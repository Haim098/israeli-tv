name = "israeli-tv-proxy"
main = "index.js"
compatibility_date = "2024-01-01"
# Keep any variables set in the dashboard when deploying from CI.
keep_vars = true

[placement]
mode = "smart"

[observability]
enabled = true

# Live viewer count + usage history (see stats.js). SQLite-backed, so it
# works on the free plan.
[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Stats"]
